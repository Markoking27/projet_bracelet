<div class="lab">

  <div class="header">
    <h1>LABORATOIRE - ANALYSE DES MALAISES</h1>
    <p>Dashboard médical temps réel</p>
  </div>

  <div class="kpis">
    <div class="kpi">
      <span>{{ totalMalaises }}</span>
      <p>Total malaises</p>
    </div>

    <div class="kpi danger">
      <span>{{ graviteElevee }}</span>
      <p>Gravité élevée</p>
    </div>
  </div>

  <div class="grid">

    <div class="card"><h3>Types</h3><canvas baseChart [data]="typeChartData" [type]="barType"></canvas></div>

    <div class="card"><h3>Gravité</h3><canvas baseChart [data]="graviteChartData" [type]="doughnutType"></canvas></div>

    <div class="card"><h3>Sexe</h3><canvas baseChart [data]="sexeChartData" [type]="pieType"></canvas></div>

    <div class="card"><h3>Âge</h3><canvas baseChart [data]="ageChartData" [type]="barType"></canvas></div>

    <div class="card"><h3>Zone</h3><canvas baseChart [data]="zoneChartData" [type]="barType"></canvas></div>

    <div class="card"><h3>Densité</h3><canvas baseChart [data]="densiteChartData" [type]="doughnutType"></canvas></div>

    <div class="card"><h3>Événements</h3><canvas baseChart [data]="eventChartData" [type]="pieType"></canvas></div>

    <div class="card"><h3>Alcool</h3><canvas baseChart [data]="alcoolChartData" [type]="barType"></canvas></div>

    <div class="card"><h3>Temps</h3><canvas baseChart [data]="tempsChartData" [type]="barType"></canvas></div>

    <div class="card large"><h3>Évolution</h3><canvas baseChart [data]="evolutionChartData" [type]="lineType"></canvas></div>

    <div class="card large"><h3>Heures</h3><canvas baseChart [data]="heureChartData" [type]="lineType"></canvas></div>

  </div>

</div>
